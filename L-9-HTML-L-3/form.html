<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <form action="assform">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="ente a name">
        </div>
        <div>
            <label for="name">Password:</label>
            <input type="password" id="pass" placeholder="password">
        </div>
        <div>
            <label for="age">Age</label>
            <input type="date" id="age" placeholder="select Age">
        </div>
        <div>
            <label for="sex">sex:</label>
            <input type="radio" name="sex" id="male">
            <label for="male">Male</label>
            <input type="radio" name="sex" id="female">
            <label for="female">Female</label>
        </div>
        <div>
            <label for="country">Country:</label>
            <select name="country" id="country">

                <option value="ind" selected>India</option>
                <option value="usa">USA</option>
                <option value="canada">CANADA</option>
                <option value="nepal">NEPAL</option>
            </select>
        </div>

        <div>
            <label for="msg">Meassage:</label>
            <br>
            <textarea name="feedback" placeholder="feedback please........" id="msg"></textarea>
        </div>
        <div>
            <input type="checkbox" name="agree" id="agree">subsribe?
        </div>
        <div>
            <button type="submit">submit</button>

        </div>


    </form>
</body>

</html>
